<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo"><img src="images/logo-sm.png" alt="Dijital Tabağım" class="nav-logo-img" /><span>Dijital Tabağım</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" data-tr="Ana Sayfa" data-en="Home">Ana Sayfa</a></li>
        <li><a href="tarifler.html" data-tr="Tarifler" data-en="Recipes">Tarifler</a></li>
        <li><a href="diyetler.html" data-tr="Diyetler" data-en="Diets">Diyetler</a></li>
        <li><a href="videolar.html" data-tr="Videolar" data-en="Videos">Videolar</a></li>
        <li><a href="vki.html" data-tr="VKİ Hesapla" data-en="BMI Calc">VKİ Hesapla</a></li>
        <li><a href="sorular.html" data-tr="Soru Sor" data-en="Ask">Soru Sor</a></li>
      </ul>
      <div class="nav-actions">
        <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
        <a href="giris.html" class="btn-login" data-tr="Giriş Yap" data-en="Login">Giriş Yap</a>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="page-hero">
    <div class="container">
      <h1 data-tr="🍳 Tarifler" data-en="🍳 Recipes">🍳 Tarifler</h1>
      <p data-tr="En lezzetli Türk mutfağı tariflerini keşfedin" data-en="Discover the most delicious Turkish cuisine recipes">En lezzetli Türk mutfağı tariflerini keşfedin</p>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <div class="container">
      <div class="filter-inner" id="filterInner">
        <button class="filter-chip active" data-cat="all" onclick="filterCat(this)" data-tr="Hepsi" data-en="All">Hepsi</button>
      </div>
    </div>
  </div>

  <section style="padding:56px 0; background:var(--bg)">
    <div class="container">
      <div class="recipes-grid" id="recipesGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div id="noResult" style="display:none;text-align:center;padding:60px;color:var(--text-muted)" data-tr="Tarif bulunamadı." data-en="No recipes found.">Tarif bulunamadı.</div>
    </div>
  </section>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="modal-box" id="modalBox" onclick="event.stopPropagation()" style="background:var(--white);border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.2);">
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="footer"><div class="container"><div class="footer-bottom"><p data-tr="© 2025 Dijital Tabağım" data-en="© 2025 Dijital Tabağım">© 2025 Dijital Tabağım</p></div></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const DEMO_RECIPES = [
      { id:'d1', name:'Menemen', name_en:'Menemen (Turkish Scrambled Eggs)', category:'Kahvaltı', category_en:'Breakfast', duration:'20 dk', duration_en:'20 min', rating:4.7, image_url:'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600',
        ingredients:['3 yumurta','2 domates','1 yeşil biber','Zeytinyağı','Tuz, karabiber'], ingredients_en:['3 eggs','2 tomatoes','1 green pepper','Olive oil','Salt, black pepper'],
        instructions:['Soğanı kavurun','Biberi ekleyin','Domatesi ekleyin','Yumurtaları kırın','Pişirin ve servis edin'], instructions_en:['Sauté the onion','Add the pepper','Add the tomatoes','Crack in the eggs','Cook and serve'] },
      { id:'d2', name:'Kuru Fasulye', name_en:'Turkish Bean Stew', category:'Ana Yemek', category_en:'Main Course', duration:'1.5 sa', duration_en:'1.5 h', rating:4.8, image_url:'https://images.unsplash.com/photo-1547592180-85f173990554?w=600',
        ingredients:['500g kuru fasulye','Salça','Soğan','Et/sucuk','Tuz'], ingredients_en:['500g dried white beans','Tomato paste','Onion','Meat/sujuk','Salt'],
        instructions:['Fasulyeyi ıslatın','Haşlayın','Salça ile kavurun','Birleştirin','Kısık ateşte pişirin'], instructions_en:['Soak the beans','Boil them','Sauté with tomato paste','Combine','Simmer on low heat'] },
      { id:'d3', name:'Kayseri Mantısı', name_en:'Kayseri Manti (Turkish Dumplings)', category:'Ana Yemek', category_en:'Main Course', duration:'1 sa', duration_en:'1 h', rating:4.9, image_url:'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=600',
        ingredients:['2 bardak un','1 yumurta','200g kıyma','Yoğurt','Sarımsak'], ingredients_en:['2 cups flour','1 egg','200g ground meat','Yogurt','Garlic'],
        instructions:['Hamuru yoğurun','İç harcı hazırlayın','Mantıları yapın','Haşlayın','Sosla servis edin'], instructions_en:['Knead the dough','Prepare the filling','Shape the dumplings','Boil them','Serve with sauce'] },
      { id:'d4', name:'Fıstıklı Baklava', name_en:'Pistachio Baklava', category:'Tatlı', category_en:'Dessert', duration:'2 sa', duration_en:'2 h', rating:4.9, image_url:'https://images.unsplash.com/photo-1619221882220-947b3d3c8861?w=600',
        ingredients:['500g yufka','300g fıstık','250g tereyağı','Şerbet'], ingredients_en:['500g phyllo dough','300g pistachios','250g butter','Syrup'],
        instructions:['Şerbeti hazırlayın','Yufkaları yayın','Fıstık serpin','Fırınlayın','Şerbet dökün'], instructions_en:['Prepare the syrup','Lay out the phyllo sheets','Sprinkle pistachios','Bake','Pour the syrup over'] },
      { id:'d5', name:'Mercimek Çorbası', name_en:'Red Lentil Soup', category:'Çorba', category_en:'Soup', duration:'35 dk', duration_en:'35 min', rating:4.6, image_url:'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=600',
        ingredients:['1 bardak mercimek','Soğan','Havuç','Patates','Baharatlar'], ingredients_en:['1 cup lentils','Onion','Carrot','Potato','Spices'],
        instructions:['Sebzeleri doğrayın','Kavurun','Su ekleyin','Pişirin','Blenderdan geçirin'], instructions_en:['Chop the vegetables','Sauté','Add water','Cook','Blend until smooth'] },
      { id:'d6', name:'İmam Bayıldı', name_en:'Imam Bayildi (Stuffed Eggplant)', category:'Sebze Yemeği', category_en:'Vegetable Dish', duration:'1 sa 10 dk', duration_en:'1 h 10 min', rating:4.5, image_url:'https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?w=600',
        ingredients:['4 patlıcan','3 soğan','4 domates','Zeytinyağı','Sarımsak'], ingredients_en:['4 eggplants','3 onions','4 tomatoes','Olive oil','Garlic'],
        instructions:['Patlıcanları kavurun','İç harcı hazırlayın','Doldurun','Tencereye dizin','Pişirin'], instructions_en:['Fry the eggplants','Prepare the filling','Stuff them','Arrange in a pot','Cook'] },
    ];

    let allRecipes = [];
    let activeCategory = 'all';
    let openId = null;

    function recipeCard(r) {
      const name = L(r,'name');
      const img = r.image_url ? `<img src="${r.image_url}" alt="${name}" loading="lazy"/>` : `<div class="recipe-img-placeholder">🍽️</div>`;
      return `<div class="recipe-card" id="rc-${r.id}" onclick="openModal('${r.id}')"><div class="recipe-img">${img}</div><div class="recipe-info"><span class="recipe-category">${L(r,'category')||''}</span><h3>${name}</h3><div class="recipe-meta"><span>⏱ ${L(r,'duration')||'—'}</span><span>⭐ ${r.rating||''}</span></div></div></div>`;
    }

    function renderRecipes() {
      const list = activeCategory==='all' ? allRecipes : allRecipes.filter(r=>r.category===activeCategory);
      const grid = document.getElementById('recipesGrid');
      const noResult = document.getElementById('noResult');
      if (!list.length) { grid.innerHTML=''; noResult.style.display='block'; return; }
      noResult.style.display='none';
      grid.innerHTML = list.map(recipeCard).join('');
    }

    function filterCat(btn) {
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      renderRecipes();
    }

    function buildFilters() {
      const bar = document.getElementById('filterInner');
      bar.querySelectorAll('.filter-chip:not([data-cat="all"])').forEach(b=>b.remove());
      const seen = new Set();
      allRecipes.forEach(r => {
        if (!r.category || seen.has(r.category)) return;
        seen.add(r.category);
        const btn = document.createElement('button');
        btn.className='filter-chip' + (r.category===activeCategory ? ' active' : '');
        btn.dataset.cat=r.category; btn.textContent=L(r,'category');
        btn.onclick=()=>filterCat(btn);
        bar.appendChild(btn);
      });
    }

    function openModal(id) {
      const r = allRecipes.find(x=>String(x.id)===String(id));
      if (!r) return;
      openId = r.id;
      const ingredients = (L(r,'ingredients')||[]).map(i=>`<li>${i}</li>`).join('');
      const steps = (L(r,'instructions')||[]).map((s,i)=>`<div style="display:flex;gap:12px;margin-bottom:12px"><div style="min-width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem">${i+1}</div><p style="margin:0;font-size:.9rem;color:var(--text-muted);padding-top:4px">${s}</p></div>`).join('');
      const img = r.image_url ? `<img src="${r.image_url}" style="width:100%;height:240px;object-fit:cover" />` : '';
      document.getElementById('modalContent').innerHTML = `
        ${img}
        <div style="padding:28px">
          <span style="font-size:.75rem;font-weight:700;color:var(--primary);text-transform:uppercase">${L(r,'category')||''}</span>
          <h2 style="font-size:1.6rem;font-weight:800;color:var(--text);margin:8px 0 6px">${L(r,'name')}</h2>
          <div style="display:flex;gap:16px;font-size:.85rem;color:var(--text-muted);margin-bottom:24px">
            <span>⏱ ${L(r,'duration')||'—'}</span><span>⭐ ${r.rating||''}</span>
          </div>
          ${ingredients ? `<h3 style="font-size:1rem;font-weight:700;margin-bottom:12px">🧂 ${t('Malzemeler','Ingredients')}</h3><ul style="padding-left:20px;margin-bottom:24px;color:var(--text-muted);font-size:.9rem;line-height:1.8">${ingredients}</ul>` : ''}
          ${steps ? `<h3 style="font-size:1rem;font-weight:700;margin-bottom:16px">👨‍🍳 ${t('Yapılışı','Instructions')}</h3>${steps}` : ''}
          <button onclick="closeModal()" style="margin-top:8px;padding:12px 24px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-family:Outfit,sans-serif;font-weight:600;cursor:pointer">${t('Kapat','Close')}</button>
        </div>`;
      document.getElementById('modalOverlay').style.display='flex';
      document.body.style.overflow='hidden';
    }

    function closeModal() {
      openId = null;
      document.getElementById('modalOverlay').style.display='none';
      document.body.style.overflow='';
    }

    document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

    async function loadRecipes() {
      try {
        const { data, error } = await supabaseClient.from('recipes').select('*').order('rating',{ascending:false});
        allRecipes = (error || !data?.length) ? DEMO_RECIPES : data;
      } catch { allRecipes = DEMO_RECIPES; }
      buildFilters();
      renderRecipes();
      const qid = new URLSearchParams(location.search).get('id');
      if (qid) openModal(qid);
    }

    document.addEventListener('DOMContentLoaded', loadRecipes);
    document.addEventListener('langchange', () => { buildFilters(); renderRecipes(); if (openId) openModal(openId); });
  </script>
</body>
</html>
