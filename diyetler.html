      </ul>

        <a href="giris.html" class="btn-login" data-tr="Giriş Yap" data-en="Login">Giriş Yap</a>

  <div class="page-hero">
    <div class="container">
      <h1 data-tr="🥗 Diyet Planları" data-en="🥗 Diet Plans">🥗 Diyet Planları</h1>
      <p data-tr="Uzman diyetisyenler tarafından hazırlanmış beslenme programları" data-en="Nutrition programs prepared by expert dietitians">Uzman diyetisyenler tarafından hazırlanmış beslenme programları</p>
    </div>
  </div>

  <section style="padding:56px 0;background:var(--bg)">
    <div class="container">
      <div class="diyetler-grid" id="diyetlerGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div id="emptyMsg" style="display:none;text-align:center;padding:80px;color:var(--text-muted)">
        <div style="font-size:3rem;margin-bottom:16px">🥗</div>
        <p data-tr="Henüz diyet planı eklenmemiş." data-en="No diet plans added yet.">Henüz diyet planı eklenmemiş.</p>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom"><p data-tr="© 2025 Dijital Tabağım. Tüm hakları saklıdır." data-en="© 2025 Dijital Tabağım. All rights reserved.">© 2025 Dijital Tabağım. Tüm hakları saklıdır.</p></div></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const DEMO_DIYETLER = [
      { id:'dd1', baslik:'Akdeniz Diyeti', baslik_en:'Mediterranean Diet', diyetisyen:'Dyt. Ayşe Kaya', diyetisyen_en:'Dietitian Ayşe Kaya', aciklama:'Zeytinyağı, sebze ve tahıllar ağırlıklı sağlıklı Akdeniz beslenme düzeni.', aciklama_en:'A healthy Mediterranean eating pattern rich in olive oil, vegetables and grains.', kalori:1800, sure:'4 Hafta', sure_en:'4 Weeks' },
      { id:'dd2', baslik:'Ketojenik Diyet', baslik_en:'Ketogenic Diet', diyetisyen:'Dyt. Mehmet Yılmaz', diyetisyen_en:'Dietitian Mehmet Yılmaz', aciklama:'Düşük karbonhidrat, yüksek yağ içerikli diyet planı. Kilo verme odaklı.', aciklama_en:'A low-carb, high-fat diet plan focused on weight loss.', kalori:1600, sure:'8 Hafta', sure_en:'8 Weeks' },
      { id:'dd3', baslik:'Vejetaryen Beslenme', baslik_en:'Vegetarian Nutrition', diyetisyen:'Dyt. Fatma Demir', diyetisyen_en:'Dietitian Fatma Demir', aciklama:'Et ürünleri tüketmeden dengeli ve yeterli besin alımını sağlayan program.', aciklama_en:'A program providing balanced, sufficient nutrition without meat products.', kalori:2000, sure:'Sürekli', sure_en:'Ongoing' },
    ];
    let diyetler = [];

    function diyetCard(d) {
      const desc = L(d,'aciklama'), sure = L(d,'sure');
      return `<div class="diyet-card" id="dc-${d.id}">
        <div class="diyet-header">
          <div class="diyet-avatar">👨‍⚕️</div>
          <div><div class="diyet-name">${L(d,'baslik')}</div><div class="diyet-doc">${L(d,'diyetisyen')}</div></div>
        </div>
        ${desc ? `<p class="diyet-desc">${desc}</p>` : ''}
        <div class="diyet-chips">
          ${d.kalori ? `<div class="diyet-chip">🔥 ${d.kalori} kcal</div>` : ''}
          ${sure ? `<div class="diyet-chip">⏱ ${sure}</div>` : ''}
        </div>
      </div>`;
    }

    function renderDiyetler() {
      const grid = document.getElementById('diyetlerGrid');
      if (!diyetler.length) { grid.innerHTML=''; document.getElementById('emptyMsg').style.display='block'; return; }
      grid.innerHTML = diyetler.map(diyetCard).join('');
    }

    async function loadDiyetler() {
      try {
        const { data, error } = await supabaseClient.from('diyet_planlari').select('*').order('created_at',{ascending:false});
        diyetler = (error || !data?.length) ? DEMO_DIYETLER : data;
      } catch { diyetler = DEMO_DIYETLER; }
      renderDiyetler();
    }

    document.addEventListener('DOMContentLoaded', loadDiyetler);
    document.addEventListener('langchange', renderDiyetler);
  </script>
</body>
</html>
