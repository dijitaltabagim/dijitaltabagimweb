  <div class="page-hero">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Supabase'deki video_id'ler — YouTube embed olarak gösterilir
    const DEMO_VIDEOS = [
      { id:'v1', baslik:'Menemen Tarifi', baslik_en:'Menemen Recipe', video_id:'ajdSDri1c-U' },
      { id:'v2', baslik:'Kuru Fasulye Tarifi', baslik_en:'Turkish Bean Stew Recipe', video_id:'7rORG0W31aE' },
    ];

    function videoCard(v) {
      return `<div class="video-card" id="vc-${v.id}">
        <div class="video-embed">
          <iframe src="https://www.youtube.com/embed/${v.video_id}" loading="lazy"
            allowfullscreen title="${L(v,'baslik')}"></iframe>
        </div>
        <div class="video-info"><h3>${L(v,'baslik')}</h3></div>
      </div>`;
    }

    let videos = [];
    async function loadVideos() {
      try {
        const { data, error } = await supabaseClient.from('videolu_tarifler').select('*').order('created_at',{ascending:false});
        videos = (error || !data?.length) ? DEMO_VIDEOS : data;
      } catch { videos = DEMO_VIDEOS; }
      document.getElementById('videosGrid').innerHTML = videos.map(videoCard).join('');
    }

    document.addEventListener('DOMContentLoaded', loadVideos);
    // Başlıkları güncelle; iframe'leri yeniden yüklememek için sadece metin değişir
    document.addEventListener('langchange', () => videos.forEach(v => {
      const h = document.querySelector(`#vc-${v.id} h3`); if (h) h.textContent = L(v,'baslik');
    }));
  </script>
